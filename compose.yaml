services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bi_lab
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: laboratorio_local
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d bi_lab"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://lab:laboratorio_local@db:5432/bi_lab
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
  lab:
    build: .
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql+psycopg://lab:laboratorio_local@db:5432/bi_lab
      WORKERS: "0"
    volumes:
      - ./results:/lab/results
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "benchmark.py"]
volumes:
  pgdata:
